<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071426">
  <title>Estrategia 2</title>
  <link rel="manifest" href="manifest.json">

<style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #071426;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .contenedor {
      max-width: 720px;
      margin: auto;
      padding: 32px;
    }

    h1 {
      font-size: 38px;
      margin: 0 0 18px;
    }

    h2 {
      margin-top: 55px;
      font-size: 28px;
    }

    .badge {
      display: inline-block;
      background: #164a80;
      padding: 10px 22px;
      border-radius: 30px;
      font-weight: bold;
      margin-bottom: 35px;
    }

    .tarjeta {
      background: #10233b;
      border-radius: 28px;
      padding: 32px;
      margin-bottom: 25px;
    }

    .capital {
      font-size: 48px;
      margin: 15px 0;
    }

    .detalle {
      color: #91a0b7;
      font-size: 18px;
    }

    .positivo {
      color: #45d17a;
    }

    .negativo {
      color: #ff6262;
    }

    .resumen {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
    }

    .resumen .tarjeta {
      padding: 28px;
    }

    .valor {
      font-size: 30px;
      margin-top: 12px;
    }

    .posicion {
      background: #10233b;
      border-radius: 25px;
      padding: 25px 28px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ticker {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .derecha {
      text-align: right;
    }

    .estado {
      background: #10233b;
      border-radius: 20px;
      padding: 25px;
      color: #91a0b7;
    }

    .actualizacion {
      color: #91a0b7;
      font-size: 14px;
      margin-top: 20px;
      text-align: center;
    }

    footer {
      text-align: center;
      color: #65748c;
      margin: 55px 0 20px;
    }

    @media (max-width: 520px) {
      .contenedor {
        padding: 24px;
      }

      .capital {
        font-size: 42px;
      }

      .resumen {
        gap: 14px;
      }

      .resumen .tarjeta {
        padding: 22px;
      }

      .valor {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

<div class="contenedor">

  <h1>Estrategia 2</h1>

  <div class="badge">PAPER TRADING</div>

  <div class="tarjeta">
    <div class="detalle">Capital actual</div>
    <div class="capital" id="capital">$10,000.00</div>
    <div id="rendimiento" class="positivo">0.00%</div>
  </div>

  <div class="resumen">

    <div class="tarjeta">
      <div class="detalle">Efectivo</div>
      <div class="valor" id="efectivo">$2,000.00</div>
    </div>

    <div class="tarjeta">
      <div class="detalle">Invertido</div>
      <div class="valor" id="invertido">$8,000.00</div>
    </div>

  </div>

  <h2>Posiciones · <span id="numeroPosiciones">4</span> / 5</h2>

  <div id="posiciones"></div>

  <h2>Mercado</h2>

  <div class="estado" id="estado">
    Consultando precios...
  </div>

  <div class="actualizacion" id="actualizacion"></div>

  <footer>
    Estrategia 2 · Cuenta PAPER
  </footer>

</div>

<script>

const CAPITAL_INICIAL = 10000;
const EFECTIVO = 2000;

const cartera = [
  { ticker: "JPM", acciones: 5.6635, costoInicial: 2000 },
  { ticker: "JNJ", acciones: 7.5926, costoInicial: 2000 },
  { ticker: "AAPL", acciones: 6.0051, costoInicial: 2000 },
  { ticker: "XOM", acciones: 12.7445, costoInicial: 2000 }
];

const formatoDinero = new Intl.NumberFormat("en-US", {
  style: "currency",
  currency: "USD"
});

function formatearFecha(fechaISO) {
  if (!fechaISO) {
    return new Date().toLocaleString("es-MX");
  }

  const fecha = new Date(fechaISO);

  if (Number.isNaN(fecha.getTime())) {
    return fechaISO;
  }

  return fecha.toLocaleString("es-MX");
}

async function cargarCotizaciones() {

  const estado = document.getElementById("estado");

  estado.textContent = "Consultando cotizaciones...";

  try {

    /*
      El parámetro evita que el navegador conserve una copia vieja
      de cotizaciones.json.
    */
    const respuesta = await fetch(
      "cotizaciones.json?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!respuesta.ok) {
      throw new Error(
        "No se pudo cargar cotizaciones.json. HTTP " +
        respuesta.status
      );
    }

    const datos = await respuesta.json();

    if (!datos.cotizaciones) {
      throw new Error(
        "El archivo cotizaciones.json no contiene cotizaciones."
      );
    }

    pintarCartera(datos);

  } catch (error) {

    console.error(error);

    estado.textContent =
      "No fue posible cargar las cotizaciones del mercado.";

    document.getElementById("actualizacion").textContent =
      "Error: " + error.message;
  }
}

function pintarCartera(datos) {

  const contenedor =
    document.getElementById("posiciones");

  contenedor.innerHTML = "";

  let totalInvertido = 0;

  cartera.forEach(posicion => {

    const cotizacion =
      datos.cotizaciones[posicion.ticker];

    if (
      !cotizacion ||
      typeof cotizacion.precio !== "number"
    ) {
      throw new Error(
        "No existe un precio válido para " +
        posicion.ticker
      );
    }

    const precioActual = cotizacion.precio;

    const valorActual =
      posicion.acciones * precioActual;

    totalInvertido += valorActual;

    const rendimiento =
      ((valorActual - posicion.costoInicial) /
      posicion.costoInicial) * 100;

    const clase =
      rendimiento >= 0
        ? "positivo"
        : "negativo";

    const signo =
      rendimiento > 0 ? "+" : "";

    const tarjeta =
      document.createElement("div");

    tarjeta.className = "posicion";

    tarjeta.innerHTML = `
      <div>
        <div class="ticker">
          ${posicion.ticker}
        </div>

        <div class="detalle">
          ${posicion.acciones.toFixed(4)} acciones
        </div>

        <div class="detalle">
          Precio: ${formatoDinero.format(precioActual)}
        </div>
      </div>

      <div class="derecha">

        <div class="ticker">
          ${formatoDinero.format(valorActual)}
        </div>

        <div class="${clase}">
          ${signo}${rendimiento.toFixed(2)}%
        </div>

      </div>
    `;

    contenedor.appendChild(tarjeta);

  });

  const capitalActual =
    EFECTIVO + totalInvertido;

  const rendimientoTotal =
    ((capitalActual - CAPITAL_INICIAL) /
    CAPITAL_INICIAL) * 100;

  document.getElementById("capital").textContent =
    formatoDinero.format(capitalActual);

  document.getElementById("efectivo").textContent =
    formatoDinero.format(EFECTIVO);

  document.getElementById("invertido").textContent =
    formatoDinero.format(totalInvertido);

  document.getElementById(
    "numeroPosiciones"
  ).textContent = cartera.length;

  const elementoRendimiento =
    document.getElementById("rendimiento");

  const signoTotal =
    rendimientoTotal > 0 ? "+" : "";

  elementoRendimiento.textContent =
    signoTotal +
    rendimientoTotal.toFixed(2) +
    "%";

  elementoRendimiento.className =
    rendimientoTotal >= 0
      ? "positivo"
      : "negativo";

  document.getElementById("estado").textContent =
    "Cotizaciones cargadas correctamente";

  document.getElementById(
    "actualizacion"
  ).textContent =
    "Cotizaciones actualizadas: " +
    formatearFecha(datos.actualizado);
}

cargarCotizaciones();

</script>

</body>
</html>
