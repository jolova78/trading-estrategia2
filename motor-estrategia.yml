name: Motor Estrategia 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  motor:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy alpaca-py

      - name: Ejecutar motor Estrategia 2
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python motor_estrategia.py

      - name: Guardar estado PAPER
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado_paper.json
          git diff --cached --quiet || git commit -m "Actualizar estado PAPER"
          git push
